<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Code Blanc"><meta name="theme-color" content="#0A4F8F"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png"><style>:root{color-scheme:light dark}body{margin:0}</style><title>Code Blanc</title>

<style>
/* Concept : tableau de bord routier. Fond bitume, bleu panneau, filet jaune de signalisation, bandes de ligne discontinue en séparateur. */
:root{
  --bg:#EDF0F3;--card:#FFFFFF;--ink:#14202B;--mut:#556372;--line:#D3DAE1;
  --sign:#0A4F8F;--signink:#FFFFFF;--amber:#E8B100;--good:#1B7F4B;--goodbg:#E3F3EA;--bad:#B3261E;--badbg:#FBE7E5;--warn:#8A5300;--warnbg:#FFF1D6;
  --font-d:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--font-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:16px;--lh:1.45;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161D;--card:#18222C;--ink:#E7EDF2;--mut:#9AA9B7;--line:#2C3A47;--sign:#5DAAEB;--signink:#06131F;--amber:#F2C500;--good:#4CC38A;--goodbg:#12301F;--bad:#FF8A82;--badbg:#3A1815;--warn:#F2B955;--warnbg:#33260D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F161D;--card:#18222C;--ink:#E7EDF2;--mut:#9AA9B7;--line:#2C3A47;--sign:#5DAAEB;--signink:#06131F;--amber:#F2C500;--good:#4CC38A;--goodbg:#12301F;--bad:#FF8A82;--badbg:#3A1815;--warn:#F2B955;--warnbg:#33260D;color-scheme:dark}
body.easy{--font-b:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;--fs:19px;--lh:1.75;letter-spacing:.02em}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:var(--fs);line-height:var(--lh);padding-block:0 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--font-d);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.45rem}h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--sign)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--font-d);font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:26px;height:26px;border-radius:6px;background:var(--sign);position:relative}
.brand i::after{content:"";position:absolute;left:12px;top:3px;bottom:3px;width:3px;background:repeating-linear-gradient(var(--amber) 0 5px,transparent 5px 9px)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:40px;border-radius:8px;font-size:.85rem;font-weight:600;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--signink)}
.road{height:4px;margin:6px 0 16px;background:repeating-linear-gradient(90deg,var(--amber) 0 18px,transparent 18px 32px);opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.mut{color:var(--mut)}.small{font-size:.85rem}.tiny{font-size:.75rem}
.btn{min-height:48px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--sign);color:var(--signink);border-color:var(--sign)}
.btn.big{min-height:56px;font-size:1.05rem;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;min-height:84px;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--font-d);font-size:1.25rem}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tab{flex:1;border:0;background:transparent;min-height:52px;font-size:.78rem;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--sign)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.8rem;font-weight:600;border:1px solid var(--line)}
.pill.good{background:var(--goodbg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sign);border-radius:99px}
.bar.low>i{background:var(--warn)}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 14px}
.prog>i{display:block;height:100%;background:var(--sign);transition:width .25s}
.qtext{font-size:1.1rem;font-weight:500}
.scene{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#EAF0F6;margin:12px 0}
.scene svg{display:block;width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--sign)}.opt[aria-pressed="true"] .k{background:var(--sign);border-color:var(--sign);color:var(--signink)}
.opt.ok{border-color:var(--good);background:var(--goodbg)}.opt.ok .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--badbg)}.opt.ko .k{background:var(--bad);border-color:var(--bad);color:#fff}
.fb{border-radius:12px;padding:14px;margin-top:14px;border:1px solid var(--line)}
.fb.ok{background:var(--goodbg)}.fb.ko{background:var(--badbg)}
.fb h3{margin-bottom:6px}
.bigscore{font-family:var(--font-d);font-size:4rem;font-weight:700;line-height:1}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.gauge{width:100%;max-width:300px;margin:0 auto;display:block}
.hbar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px;gap:10px;align-items:center}
.hbar span{overflow-wrap:anywhere;font-size:.85rem}
.hbar b{text-align:right;font-variant-numeric:tabular-nums;font-size:.85rem}
.breathe{width:150px;height:150px;border-radius:50%;background:var(--sign);margin:20px auto;opacity:.85;animation:br 8s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.55)}50%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.breathe{animation:none;transform:scale(.8)}.prog>i{transition:none}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.sw button{flex:none;width:52px;height:30px;border-radius:99px;border:2px solid var(--line);background:var(--line);position:relative;padding:0}
.sw button::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--card);transition:left .15s}
.sw button[aria-pressed="true"]{background:var(--sign);border-color:var(--sign)}
.sw button[aria-pressed="true"]::after{left:24px}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.85rem}
input[type=text],select{font:inherit;width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.spark{width:100%;height:96px}
.hide{display:none!important}
</style>

<script>/* scenes.js - moteur de mises en situation ETG (SVG pur, sans dépendance).
   Toutes les illustrations sont ORIGINALES (aucune photo, aucun logo/marque).
   API : window.Scenes = { render, check, validate, signs, voyants, version } */
(function (global) {
'use strict';
var VERSION = '1.0.0';
var NS = 'http://www.w3.org/2000/svg';
var RED = '#d4202a', BLUE = '#0a58a8', K = '#141414', YEL = '#f6c90e';

/* ---------- helpers SVG (chaînes) ---------- */
function st(d, w, c, x) { return '<path d="' + d + '" fill="none" stroke="' + (c || K) + '" stroke-width="' + (w || 5) + '" stroke-linecap="round" stroke-linejoin="round" ' + (x || '') + '/>'; }

function circ(x, y, r, c) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + (c || K) + '"/>'; }

function ped(c) { c = c || K; return circ(0, -12, 4, c) + st('M0 -6V6M0 6L-5 16M0 6L5 16M-7 0L7 -3', 4.5, c); }
function bike(c) { c = c || K; return '<circle cx="-11" cy="7" r="7" fill="none" stroke="' + c + '" stroke-width="3.2"/><circle cx="11" cy="7" r="7" fill="none" stroke="' + c + '" stroke-width="3.2"/>' + st('M-11 7L-3 -4H7L11 7M-3 -4L-6 -9M7 -4L5 -9', 3.2, c); }
function carS(c, x) { return '<g transform="translate(' + x + ' 0)">' + rect(-6, -11, 12, 22, c, 3.5) + rect(-4, -5, 8, 5, '#fff', 1) + '</g>'; }
function arrowSvg(c) { return '<path d="M0 -18L13 -2H5V18H-5V-2H-13Z" fill="' + c + '"/>'; }
/* signes : cadres */
function tri(inner, s) { return '<polygon points="50,6 95,87 5,87" fill="#fff" stroke="' + RED + '" stroke-width="9" stroke-linejoin="round"/><g transform="translate(50 63) scale(' + (s || 0.9) + ')">' + inner + '</g>'; }

  var out = '';

  { code: 'A1a', nom: 'Virage à droite', fam: 'danger', svg: function () { return tri(st('M-8 20V3Q-8 -9 6 -13', 6) + fl('M2 -21L15 -13L2 -5Z')); } },

  { code: 'A1c', nom: 'Succession de virages (premier à droite)', fam: 'danger', aVerifier: true, svg: function () { return tri(st('M-10 20V10Q-10 2 0 0Q10 -2 10 -10', 6) + fl('M4 -10L10 -20L16 -10Z')); } },
  { code: 'A2a', nom: 'Cassis (creux de chaussée)', fam: 'danger', aVerifier: true, svg: function () { return tri(st('M-18 -4Q0 26 18 -4', 6) + st('M-18 16H18', 3)); } },
  { code: 'A2b', nom: "Dos d'âne", fam: 'danger', aVerifier: true, svg: function () { return tri(st('M-18 12Q0 -16 18 12', 6) + st('M-18 16H18', 3)); } },
  { code: 'A3', nom: 'Chaussée rétrécie', fam: 'danger', aVerifier: true, svg: function () { return tri(st('M-12 20V7Q-12 -1 -6 -5V-18', 5.5) + st('M12 20V7Q12 -1 6 -5V-18', 5.5)); } },
  { code: 'A4', nom: 'Chaussée particulièrement glissante', fam: 'danger', svg: function () { return tri(fl('M-9 -2Q-9 -9 -3 -9H3Q9 -9 9 -2V6H-9Z') + rect(-6, -6, 12, 4, '#fff', 1) + circ(-6, 6, 3) + circ(6, 6, 3) + st('M-11 13q3 -4 6 0t6 0t6 0', 3)); } },
  { code: 'A13a', nom: 'Passage pour piétons', fam: 'danger', aVerifier: true, svg: function () { return tri('<g transform="translate(0 -4) scale(.85)">' + ped() + '</g>' + rect(-17, 12, 6, 6) + rect(-8, 12, 6, 6) + rect(1, 12, 6, 6) + rect(10, 12, 6, 6)); } },
  { code: 'A13b', nom: 'Endroit fréquenté par des enfants', fam: 'danger', aVerifier: true, svg: function () { return tri('<g transform="translate(-6 -1) scale(.8)">' + ped() + '</g><g transform="translate(9 5) scale(.55)">' + ped() + '</g>'); } },

  { code: 'A15b', nom: "Passage d'animaux domestiques", fam: 'danger', aVerifier: true, svg: function () { return tri(rect(-12, -7, 22, 11, K, 2) + rect(8, -11, 8, 7, K, 2) + rect(-11, 3, 3, 10) + rect(-4, 3, 3, 10) + rect(3, 3, 3, 10) + rect(8, 3, 3, 10) + st('M-12 -5Q-17 -3 -16 4', 2.5)); } },
  { code: 'A21', nom: 'Débouché de cyclistes', fam: 'danger', aVerifier: true, svg: function () { return tri('<g transform="scale(.8)">' + bike() + '</g>'); } },
  { code: 'AB1', nom: 'Intersection où la priorité est à droite', fam: 'priorite', aVerifier: true, svg: function () { return tri(st('M-13 -13L13 13M13 -13L-13 13', 7)); } },
  { code: 'AB3a', nom: 'Cédez le passage', fam: 'priorite', svg: function () { return '<polygon points="6,14 94,14 50,92" fill="#fff" stroke="' + RED + '" stroke-width="9" stroke-linejoin="round"/>'; } },
  { code: 'AB4', nom: 'Arrêt à l\'intersection (STOP)', fam: 'priorite', svg: function () { return '<polygon points="' + octPts(49, 22.5) + '" fill="' + RED + '" stroke="#fff" stroke-width="2"/><polygon points="' + octPts(43, 22.5) + '" fill="none" stroke="#fff" stroke-width="2.5"/>' + txt('STOP', 50, 60, 24, '#fff'); } },
  { code: 'AB6', nom: 'Route à caractère prioritaire', fam: 'priorite', svg: function () { return '<polygon points="50,3 97,50 50,97 3,50" fill="#fff" stroke="' + K + '" stroke-width="2"/><polygon points="50,14 86,50 50,86 14,50" fill="' + YEL + '"/>'; } },
  { code: 'AB7', nom: 'Fin de route à caractère prioritaire', fam: 'priorite', svg: function () { return '<polygon points="50,3 97,50 50,97 3,50" fill="#fff" stroke="' + K + '" stroke-width="2"/><polygon points="50,14 86,50 50,86 14,50" fill="' + YEL + '"/><g stroke="#222" stroke-width="3.5"><line x1="22" y1="78" x2="78" y2="22"/><line x1="30" y1="86" x2="86" y2="30"/><line x1="14" y1="70" x2="70" y2="14"/></g>'; } },

  { code: 'B6d', nom: 'Arrêt et stationnement interdits', fam: 'interdiction', svg: function () { return '<circle cx="50" cy="50" r="44" fill="' + BLUE + '" stroke="' + RED + '" stroke-width="10"/>' + st('M27 27L73 73M73 27L27 73', 8, RED); } },

  { code: 'B33', nom: 'Fin de limitation de vitesse', fam: 'interdiction', aVerifier: true, svg: function (o) { return '<circle cx="50" cy="50" r="45" fill="#fff" stroke="#333" stroke-width="3"/>' + txt((o && o.vitesse) || 50, 50, 62, 34, '#777') + '<g stroke="#333" stroke-width="3"><line x1="24" y1="70" x2="76" y2="30"/><line x1="30" y1="78" x2="82" y2="38"/><line x1="18" y1="62" x2="70" y2="22"/></g>'; } },
  { code: 'B34', nom: "Fin d'interdiction de dépasser", fam: 'interdiction', aVerifier: true, svg: function () { return '<circle cx="50" cy="50" r="45" fill="#fff" stroke="#333" stroke-width="3"/><g transform="translate(50 50) scale(1.1)" opacity=".55">' + carS('#777', -9) + carS('#444', 9) + '</g><g stroke="#333" stroke-width="3"><line x1="24" y1="70" x2="76" y2="30"/><line x1="30" y1="78" x2="82" y2="38"/><line x1="18" y1="62" x2="70" y2="22"/></g>'; } },

Klaxonner peut le déstabiliser.","piege":"Klaxonner surprend le cycliste.","source":{"url":"https://www.legifrance.gouv.fr/codes/id/LEGISCTA000032465086/","libelle":"Légifrance - Code de la route (article cité dans l'explication)","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["depassement","cycliste"],"version":2},{"id":"T02-041","theme":2,"type":"question","enonce":"Quand un véhicule vous dépasse, que devez-vous éviter ? (3 réponses attendues)","media":null,"options":[{"id":"a","texte":"Freiner brusquement"},{"id":"b","texte":"Accélérer"},{"id":"c","texte":"Maintenir votre trajectoire"},{"id":"d","texte":"Vous rapprocher de l'axe"}],"bonnes":["a","b","d"],"multiple":true,"explication":"Il faut garder une conduite stable et ne pas gêner le dépassement : pas d'accélération, ni de déport, ni de coup de frein.","piege":"Réagir en « défendant » sa place.","source":{"url":"https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006159601/","libelle":"Légifrance - Code de la route, R414-1 à R414-17 (croisement et dépassement)","verifieLe":"2026-11-05"},"aVerifier":false,"difficulte":3,"tags":["etre_depasse"],"version":1},{"id":"T02-042","theme":2,"type":"question","enonce":"Dans quels cas la ligne continue peut-elle être franchie ?","media":null,"options":[{"id":"a","texte":"Pour gagner du temps"},{"id":"b","texte":"Quand la route est vide"},{"id":"c","texte":"Pour dépasser sans visibilité"},{"id":"d","texte":"Uniquement en chevauchant, pour dépasser un cycle ou un EDPM"}],"bonnes":["d"],"multiple":false,"explication":"Une ligne continue ne se franchit ni ne se chevauche (R412-19). Seul le chevauchement est permis pour dépasser un cycle, un cyclomobile léger ou un EDPM.","piege":"Estimer que le vide ou l'urgence autorise l'infraction.","source":{"url":"https://legifrance.gouv.fr/codes/article_lc/LEGIARTI000045025516/2026-11-05","libelle":"Légifrance - Code de la route, article R412-19 (lignes continues)","verifieLe":"2026-11-05"},"aVerifier":false,"difficulte":2,"tags":["marquage","ligne_continue"],"version":2},{"id":"T02-043","theme":2,"type":"question","enonce":"Quelles actions facilitent le croisement sur une route étroite ? (3 réponses attendues)","media":null,"options":[{"id":"a","texte":"S'arrêter si nécessaire"},{"id":"b","texte":"Accélérer"},{"id":"c","texte":"Ralentir"},{"id":"d","texte":"Se serrer à droite"}],"bonnes":["a","c","d"],"multiple":true,"explication":"Ralentir, se serrer et s'arrêter si besoin garantissent un croisement sûr.","piege":"Chercher à passer sans réduire l'allure.","source":{"url":"https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006159601/","libelle":"Légifrance - Code de la route, R414-1 à R414-17 (croisement et dépassement)","verifieLe":"2026-11-05"},"aVerifier":false,"difficulte":2,"tags":["croisement","route_etroite"],"version":1},{"id":"T02-044","theme":2,"type":"question","enonce":"Pour dépasser un véhicule lent, il faut : (3 réponses attendues)","media":null,"options":[{"id":"a","texte":"Une visibilité suffisante"},{"id":"b","texte":"Un rabattement possible"},{"id":"c","texte":"Aucun usager en train de vous dépasser"},{"id":"d","texte":"Un véhicule en face à moins de 100 m"}],"bonnes":["a","b","c"],"multiple":true,"explication":"Visibilité, rabattement possible et absence de véhicule en cours de dépassement sont nécessaires. Un véhicule proche en face rend la manœuvre dangereuse.","piege":"S'engager malgré un véhicule proche.","source":{"url":"https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074228/LEGISCTA000006159601/","libelle":"Légifrance - Code de la route, R414-1 à R414-17 (croisement et dépassement)","verifieLe":"2026-11-05"},"aVerifier":false,"difficulte":2,"tags":["depassement","conditions"],"version":1},{"id":"T02-045","theme":2,"type":"question","enonce":"Quels éléments rendent un dépassement interdit ? (3 réponses attendues)","media":null,"options":[{"id":"a","texte":"Une ligne continue côté dépassement"},{"id":"b","texte":"Un panneau d'interdiction de dépasser"},{"id":"c","texte":"Un passage à niveau sans barrières"},{"id":"d","texte":"Un véhicule lent devant"}],"bonnes":["a","b","c"],"multiple":true,"explication":"Une ligne continue (R412-19), le panneau B3 et une voie ferrée sans barrières (R414-12) interdisent le dépassement. Un véhicule lent n'est pas une raison suffisante.","piege":"Penser qu'un véhicule lent autorise la manœuvre.","source":{"url":"https://legifrance.gouv.fr/codes/article_lc/LEGIARTI000006842230/2001-06-01","libelle":"Légifrance - Code de la route, article R414-12 (dépassement aux voies ferrées sans barrières)","verifieLe":"2026-11-05"},"aVerifier":false,"difficulte":3,"tags":["depassement","interdictions"],"version":2},{"id":"T03-001","theme":3,"type":"question","enonce":"Quelles pratiques réduisent la consommation de carburant ? (2 réponses attendues)","media":null,"options":[{"id":"a","texte":"Rester sur les rapports intermédiaires pour garder de la reprise"},{"id":"b","texte":"Maintenir une vitesse stabilisée"},{"id":"c","texte":"Anticiper les ralentissements en levant le pied"},{"id":"d","texte":"Rouler en roue libre dans les descentes"}],"bonnes":["b","c"],"multiple":true,"explication":"Une vitesse stable et l'anticipation évitent accélérations et freinages inutiles. La roue libre est dangereuse et n'économise rien, et un rapport trop bas fait monter le régime.","piege":"La roue libre semble économique mais coupe le frein moteur et la maîtrise du véhicule.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["ecoconduite","consommation"],"version":2},{"id":"T03-002","theme":3,"type":"question","enonce":"Un pneu sous-gonflé entraîne : (3 réponses attendues)","media":null,"options":[{"id":"a","texte":"Une usure plus rapide au centre de la bande de roulement"},{"id":"b","texte":"Une surconsommation"},{"id":"c","texte":"Un risque d'échauffement et d'éclatement"},{"id":"d","texte":"Une usure plus rapide sur les bords de la bande de roulement"}],"bonnes":["b","c","d"],"multiple":true,"explication":"Un pneu sous-gonflé s'écrase, chauffe et s'use sur les épaules, et augmente la résistance au roulement. L'usure centrale est la marque du surgonflage.","piege":"On confond les signes du sous-gonflage (bords) et du surgonflage (centre).","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["pneus","consommation"],"version":2},{"id":"T03-003","theme":3,"type":"question","enonce":"Vous conservez toute l'année une galerie ou un coffre de toit, même vide. Quelle conséquence ?","media":null,"options":[{"id":"a","texte":"Une surconsommation due à la résistance de l'air"},{"id":"b","texte":"Une surconsommation uniquement au-dessus de 130 km/h"},{"id":"c","texte":"Une consommation inchangée tant qu'il est vide"},{"id":"d","texte":"Une baisse de consommation grâce à l'appui aérodynamique"}],"bonnes":["a"],"multiple":false,"explication":"Même vide, l'équipement dégrade l'aérodynamisme dès les vitesses moyennes. Il vaut mieux le démonter quand il ne sert pas.","piege":"On croit que seul le poids compte, alors que c'est la prise au vent qui pèse.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["consommation","aerodynamique"],"version":2},{"id":"T03-004","theme":3,"type":"question","enonce":"Quand la vitesse augmente, la consommation :","media":null,"options":[{"id":"a","texte":"Diminue"},{"id":"b","texte":"Dépend uniquement du poids"},{"id":"c","texte":"Augmente fortement à cause de la résistance de l'air"},{"id":"d","texte":"Reste identique"}],"bonnes":["c"],"multiple":false,"explication":"La résistance de l'air augmente très vite avec la vitesse, donc consommation et émissions augmentent nettement.","piege":"Assimiler vitesse et temps gagné : le gain réel est faible sur trajet court.","source":{"url":"https://www.securite-routiere.gouv.fr/reglementation-liee-aux-risques/reglementation-de-la-vitesse-au-volant","libelle":"Sécurité routière - Réglementation de la vitesse","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["ecoconduite","vitesse"],"version":1},{"id":"T03-005","theme":3,"type":"question","enonce":"Au démarrage à froid, il est préférable de :","media":null,"options":[{"id":"a","texte":"Rouler sans forcer sur le moteur dès le départ"},{"id":"b","texte":"Laisser tourner le moteur 5 minutes à l'arrêt"},{"id":"c","texte":"Solliciter fortement le moteur pour chauffer plus vite"},{"id":"d","texte":"Rouler en rapport bas pour monter en température"}],"bonnes":["a"],"multiple":false,"explication":"Le moteur chauffe plus vite en roulant doucement qu'à l'arrêt, qui consomme et pollue inutilement. Forcer à froid use prématurément le moteur.","piege":"Laisser chauffer à l'arrêt semble prudent mais consomme sans réchauffer efficacement.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["ecoconduite","demarrage"],"version":2},{"id":"T03-006","theme":3,"type":"question","enonce":"Un défaut d'entretien (filtre à air encrassé, pneus sous-gonflés) a surtout pour effet :","media":null,"options":[{"id":"a","texte":"De ne rien changer tant qu'aucun voyant ne s'allume"},{"id":"b","texte":"D'augmenter la consommation et les rejets polluants"},{"id":"c","texte":"D'augmenter seulement le bruit"},{"id":"d","texte":"De réduire la consommation car le moteur est moins sollicité"}],"bonnes":["b"],"multiple":false,"explication":"Un moteur ou des pneus mal entretenus consomment davantage et polluent plus avant même qu'un voyant ne s'allume.","piege":"On attend le voyant alors que la dérive de consommation commence bien avant.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["entretien","ecoconduite"],"version":2},{"id":"T03-007","theme":3,"type":"question","enonce":"Dans une descente, avec un rapport engagé et le pied levé de l'accélérateur :","media":null,"options":[{"id":"a","texte":"Il faut couper le moteur"},{"id":"b","texte":"La consommation reste normale"},{"id":"c","texte":"L'injection est coupée sur la plupart des moteurs actuels, la consommation est quasi nulle"},{"id":"d","texte":"Il faut passer au point mort pour économiser"}],"bonnes":["c"],"multiple":false,"explication":"Pied levé et rapport engagé, le moteur freine et consomme presque rien. Le point mort n'économise rien et prive du frein moteur.","piege":"Passer au point mort : danger et pas d'économie.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["frein_moteur","ecoconduite"],"version":1},{"id":"T03-008","theme":3,"type":"question","enonce":"Quelles affirmations sur la climatisation sont exactes ? (2 réponses attendues)","media":null,"options":[{"id":"a","texte":"À vitesse élevée, rouler vitres grandes ouvertes consomme souvent plus qu'avec la climatisation"},{"id":"b","texte":"En ville, elle augmente la consommation"},{"id":"c","texte":"Elle réduit la charge du moteur donc la consommation"},{"id":"d","texte":"Elle ne consomme que pendant les premières minutes"}],"bonnes":["a","b"],"multiple":true,"explication":"La climatisation consomme surtout en ville ; à vitesse élevée, les vitres ouvertes dégradent davantage l'aérodynamisme. Elle consomme tant qu'elle fonctionne.","piege":"On pense « clim = toujours pire » ou « vitres ouvertes = toujours mieux ».","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["climatisation","consommation"],"version":2},{"id":"T03-009","theme":3,"type":"question","enonce":"Un voyant rouge (pression d'huile, température moteur) s'allume en roulant. Que faites-vous ?","media":null,"options":[{"id":"a","texte":"Je continue en ajoutant de l'huile à la prochaine station"},{"id":"b","texte":"Je continue à vitesse réduite jusqu'au prochain garage"},{"id":"c","texte":"J'attends qu'il s'éteigne en roulant sur un rapport bas"},{"id":"d","texte":"Je m'arrête dès que possible en sécurité et je coupe le moteur"}],"bonnes":["d"],"multiple":false,"explication":"Un voyant rouge impose l'arrêt rapide en sécurité pour éviter une casse du moteur. Continuer, même doucement, peut détruire le moteur.","piege":"Un trajet « à vitesse réduite » paraît raisonnable mais le dommage se produit quand même.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["voyants","mecanique"],"version":2},{"id":"T03-010","theme":3,"type":"question","enonce":"Le régulateur de vitesse peut aider à limiter la consommation sur route dégagée, mais :","media":null,"options":[{"id":"a","texte":"Il est obligatoire sur autoroute"},{"id":"b","texte":"Le conducteur reste responsable et doit rester vigilant"},{"id":"c","texte":"Il est interdit en dessous de 130 km/h"},{"id":"d","texte":"Il dispense de surveiller la route"}],"bonnes":["b"],"multiple":false,"explication":"En maintenant une vitesse constante, il peut réduire la consommation, mais le conducteur reste responsable du véhicule.","piege":"Croire qu'un système d'aide décharge de la vigilance.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["regulateur","ecoconduite"],"version":1},{"id":"T03-011","theme":3,"type":"question","enonce":"Quels sont les bénéfices du covoiturage ? (2 réponses attendues)","media":null,"options":[{"id":"a","texte":"Une consommation réduite pour chaque véhicule"},{"id":"b","texte":"Moins de véhicules en circulation"},{"id":"c","texte":"Des émissions réduites par personne transportée"},{"id":"d","texte":"Un temps de trajet toujours plus court"}],"bonnes":["b","c"],"multiple":true,"explication":"Partager un véhicule diminue le nombre de voitures et les émissions par personne. La consommation du véhicule lui-même ne baisse pas, elle augmente même un peu avec la charge.","piege":"On confond gain collectif (par personne) et consommation du véhicule.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["covoiturage","environnement"],"version":2},{"id":"T03-012","theme":3,"type":"question","enonce":"Pourquoi les trajets très courts à froid sont-ils pénalisants ?","media":null,"options":[{"id":"a","texte":"Le moteur n'atteint pas sa température optimale : il consomme et pollue davantage"},{"id":"b","texte":"Le moteur travaille plus quand il est déjà chaud"},{"id":"c","texte":"Le catalyseur ne fonctionne qu'à froid"},{"id":"d","texte":"Les pneus sont plus durs et freinent mal"}],"bonnes":["a"],"multiple":false,"explication":"Un moteur froid consomme plus et le catalyseur est moins efficace. Plusieurs petits trajets enchaînés sont plus polluants qu'un trajet unique.","piege":"On croit le catalyseur actif d'emblée : il n'est efficace qu'une fois chaud.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["moteur_froid","consommation"],"version":2},{"id":"T03-013","theme":3,"type":"question","enonce":"Rouler à 130 km/h plutôt qu'à 110 km/h sur autoroute :","media":null,"options":[{"id":"a","texte":"N'a pas d'effet sur 100 km"},{"id":"b","texte":"Augmente nettement la consommation pour un gain de temps limité"},{"id":"c","texte":"Réduit le temps de trajet de moitié"},{"id":"d","texte":"Réduit la consommation car le moteur travaille moins longtemps"}],"bonnes":["b"],"multiple":false,"explication":"La consommation augmente fortement avec la vitesse alors que le gain de temps reste faible.","piege":"On surestime le gain de temps.","source":{"url":"https://www.securite-routiere.gouv.fr/reglementation-liee-aux-risques/reglementation-de-la-vitesse-au-volant","libelle":"Sécurité routière - Réglementation de la vitesse","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["vitesse","consommation"],"version":2},{"id":"T03-014","theme":3,"type":"question","enonce":"Rouler à vitesse stabilisée sur un rapport trop bas :","media":null,"options":[{"id":"a","texte":"Réduit la consommation grâce à une meilleure reprise"},{"id":"b","texte":"Réduit l'usure du moteur"},{"id":"c","texte":"Augmente la consommation seulement en boîte automatique"},{"id":"d","texte":"Augmente le régime, le bruit et la consommation"}],"bonnes":["d"],"multiple":false,"explication":"Un rapport trop bas fait tourner le moteur plus vite pour la même vitesse, donc consomme plus. Il faut passer les rapports supérieurs dès que possible.","piege":"La reprise est un faux argument : l'écoconduite privilégie les rapports élevés.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["rapports","ecoconduite"],"version":2},{"id":"T03-015","theme":3,"type":"question","enonce":"Charger inutilement le coffre :","media":null,"options":[{"id":"a","texte":"Augmente la consommation"},{"id":"b","texte":"Diminue l'usure des pneus"},{"id":"c","texte":"Améliore la stabilité"},{"id":"d","texte":"N'a aucun effet"}],"bonnes":["a"],"multiple":false,"explication":"Un poids supplémentaire demande plus d'énergie pour avancer et pour freiner.","piege":"Penser que seul le toit compte.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":1,"tags":["poids","consommation"],"version":1,"retiree":true},{"id":"T03-016","theme":3,"type":"question","enonce":"À quelle fréquence vérifier la pression des pneus ?","media":null,"options":[{"id":"a","texte":"Uniquement quand un voyant s'allume"},{"id":"b","texte":"Tous les mois et avant un long trajet, à froid"},{"id":"c","texte":"Tous les mois, juste après avoir roulé"},{"id":"d","texte":"Une fois par an au contrôle technique"}],"bonnes":["b"],"multiple":false,"explication":"Les pneus perdent de la pression naturellement. Il faut contrôler à froid car l'échauffement fausse la mesure.","piege":"Mesurer à chaud donne une valeur trop haute.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["pneus","pression"],"version":2},{"id":"T03-017","theme":3,"type":"situation","enonce":"Le voyant « pression d'huile » s'allume en rouge au tableau de bord. Que devez-vous faire ?","media":{"scene":"tableau_bord","params":{"voyant":"pression d'huile","couleur":"rouge"},"alt":"Voyant pression d'huile rouge"},"options":[{"id":"a","texte":"S'arrêter dès que possible en sécurité et couper le moteur"},{"id":"b","texte":"Le freinage reste possible sans ABS : faire vérifier rapidement le système"},{"id":"c","texte" ce - Code de la route (article cité dans l'explication)","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["feux","orange"],"version":2},{"id":"T06-005","theme":6,"type":"question","enonce":"Un agent de la circulation lève le bras verticalement. Que cela signifie-t-il ?","media":null,"options":[{"id":"a","texte":"Passage libre"},{"id":"b","texte":"Ralentissement"},{"id":"c","texte":"Arrêt pour tous les usagers, sauf ceux déjà engagés"},{"id":"d","texte":"Priorité aux véhicules venant de gauche"}],"bonnes":["c"],"multiple":false,"explication":"Bras levé : arrêt de tous les usagers, sauf ceux qui sont déjà engagés au carrefour.","piege":"Confondre avec un signal de ralentissement.","source":{"url":"https://www.legifrance.gouv.fr/codes/id/LEGISCTA000032465086/","libelle":"Légifrance - Code de la route (article cité dans l'explication)","verifieLe":null},"aVerifier":true,"difficulte":1,"tags":["agent","signalisation"],"version":1},{"id":"T06-006","theme":6,"type":"question","enonce":"Un panneau de direction à fond bleu indique :","media":null,"options":[{"id":"a","texte":"Une déviation"},{"id":"b","texte":"Une route nationale"},{"id":"c","texte":"Un itinéraire local"},{"id":"d","texte":"Un itinéraire sur autoroute"}],"bonnes":["d"],"multiple":false,"explication":"Le fond bleu est réservé aux autoroutes ; routes principales et nationales sont en vert, les directions locales en blanc.","piege":"Le fond vert ou blanc est souvent confondu avec le bleu.","source":{"url":"https://www.legifrance.gouv.fr/codes/id/LEGISCTA000032465086/","libelle":"Légifrance - Code de la route (article cité dans l'explication)","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["panneau","direction"],"version":2},{"id":"T06-007","theme":6,"type":"question","enonce":"Un panneau de signalisation temporaire de chantier (fond jaune) contredit un panneau permanent. Lequel suivez-vous ?","media":null,"options":[{"id":"a","texte":"Le panneau temporaire de chantier"},{"id":"b","texte":"Le moins restrictif"},{"id":"c","texte":"Le panneau permanent"},{"id":"d","texte":"Le plus récent"}],"bonnes":["a"],"multiple":false,"explication":"La signalisation temporaire l'emporte sur la signalisation permanente.","piege":"Penser que ce qui est « officiel » dure : la mention temporaire prime.","source":{"url":"https://www.legifrance.gouv.fr/codes/id/LEGISCTA000032465086/","libelle":"Légifrance - Code de la route (article cité dans l'explication)","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["panneau","chantier"],"version":1},{"id":"T06-008","theme":6,"type":"question","enonce":"Quelle indication prime sur toutes les autres ?","media":null,"options":[{"id":"a","texte":"Un feu tricolore"},{"id":"b","texte":"Les signes de l'agent de la circulation"},{"id":"c","texte":"Un panneau de limitation"},{"id":"d","texte":"La règle de priorité à droite"}],"bonnes":["b"],"multiple":false,"explication":"Hiérarchie : agent, puis feux, puis panneaux, puis règles générales.","piege":"Faire passer le feu avant l'agent.","source":{"url":"https://www.legifrance.gouv.fr/codes/id/LEGISCTA000032465086/","libelle":"Légifrance - Code de la route (article cité dans l'explication)","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["hierarchie","agent"],"version":1},{"id":"T06-009","theme":6,"type":"question","enonce":"Quelle différence existe entre le STOP et le « cédez le passage » ?","media":null,"options":[{"id":"a","texte":"Au STOP, l'arrêt est obligatoire même si la route est libre ; au « cédez le passage », il n'est nécessaire que si la voie n'est pas libre"},{"id":"b","texte":"Au « cédez le passage », l'arrêt est obligatoire ; au STOP, seulement si la voie est occupée"},{"id":"c","texte":"Le STOP ne s'applique qu'en agglomération"},{"id":"d","texte":"Le STOP ne s'applique qu'aux poids lourds"}],"bonnes":["a"],"multiple":false,"explication":"Le STOP impose l'arrêt complet quelles que soient les circonstances ; le « cédez » impose de ralentir et de céder, avec arr ère pour dégager la zone"},{"id":"b","texte":"Je dépasse sans changer d'allure"},{"id":"c","texte":"Je klaxonne pour qu'ils restent sur le trottoir"},{"id":"d","texte":"Je ralentis fortement et je suis prêt à m'arrêter"}],"bonnes":["d"],"multiple":false,"explication":"Les enfants peuvent traverser sans regarder. La vitesse doit permettre l'arrêt immédiat.","piege":"Le car arrêté est un signal de danger, pas d'obstacle à dépasser.","source":{"url":"https://www.securite-routiere.gouv.fr/chaque-situation-sa-conduite","libelle":"Sécurité routière - À chaque situation sa conduite","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["enfant","bus"],"version":2},{"id":"T09-021","theme":9,"type":"situation","enonce":"Vous êtes piéton. Le feu piéton est vert et une voiture tourne à droite vers vous. Que faites-vous ?","media":{"scene":"carrefour","params":{"type":"croisement","pointDeVue":"pieton","pietons":[{"id":"moi","etat":"feu_vert"}],"vehicules":[{"id":"V","depuis":"S","manoeuvre":"droite"}]},"alt":"Vous êtes piéton. Le feu piéton est vert et une voiture tourne à droite vers vous. Que fai"},"options":[{"id":"a","texte":"Je tape sur la voiture"},{"id":"b","texte":"Je cours"},{"id":"c","texte":"Je traverse en vérifiant que la voiture m'a vu et s'arrête"},{"id":"d","texte":"Je m'arrête au milieu"}],"bonnes":["c"],"multiple":false,"explication":"Même avec le feu vert, on vérifie que les véhicules qui tournent s'arrêtent avant de traverser.","piege":"Se croire protégé par le feu.","source":{"url":"https://www.legifrance.gouv.fr/codes/id/LEGISCTA000032465086/","libelle":"Légifrance - Code de la route (article cité dans l'explication)","verifieLe":null},"aVerifier":true,"difficulte":2,"tags":["pieton","feux"],"version":1,"regardEnPremier":"La voiture qui tourne vers vous.","reponseAttendue":{"mode":"options","bonnes":["c"]},"pointDeVue":"pieton"},{"id":"T09-022","theme":9,"type":"situation","enonce":"Vous êtes cycliste et voulez tourner à gauche. Que faites-vous ?","med var db=null,usr=null,canWrite=true,dbState="off",remote=null,unsub=null;
function initDb(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    db=r[0];usr=r[1];if(!db){return}
    dbState="on";
    if(usr&&usr.can){usr.can("data.write").then(function(v){if(v===false){canWrite=false;role="parent";mode="parent";render()}})}

/* ---------- sélection des questions ---------- */
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function qWeight(q){var st=S.qs[q.id];var w=1;if(!st)w=3;else{if(st.box&&st.box<4&&st.next<=Date.now())w=5;if(st.last===0)w+=1;if(st.last===1&&st.box>=3)w=.4}return w}
function pickWeighted(pool,n){var out=[],items=pool.slice();while(out.length<n&&items.length){var tot=items.reduce(function(s,q){return s+qWeight(q)},0),r=Math.random()*tot,i=0;for(;i<items.length;i++){r-=qWeight(items[i]);if(r<=0)break}if(i>=items.length)i=items.length-1;out.push(items.splice(i,1)[0])}return out}
function drawExam(){
  var tot=THEMES.reduce(function(s,t){return s+t.cibleBanque},0),out=[],used={};
  THEMES.forEach(function(t){var n=Math.round(CFG.size*t.cibleBanque/tot);var pool=QH.filter(function(q){return q.theme===t.id});pickWeighted(pool,n).forEach(function(q){out.push(q);used[q.id]=1})});
  if(out.length>CFG.size)out=shuffle(out).slice(0,CFG.size);
  while(out.length<CFG.size){var rest=QH.filter(function(q){return !used[q.id]});if(!rest.length)break;var q=pickWeighted(rest,1)[0];out.push(q);used[q.id]=1}
  return shuffle(out);
}
function dueErrors(){var now=Date.now();return QS.filter(function(q){var s=S.qs[q.id];return s&&s.box&&s.box<4&&s.next<=now})}
function allErrors(){return QS.filter(function(q){var s=S.qs[q.id];return s&&s.box&&s.box<4})}
var LEITNER=[0,1,3,7,14];
function recordAnswer(q,ok,ms){
  var s=S.qs[q.id]||(S.qs[q.id]={n:0,ok:0,box:0,next:0,last:null});
  s.n++;if(ok)s.ok++;s.last=ok?1:0;
  if(!ok){s.box=1;s.next=Date.now()+864e5}
  else if(s.box){s.box++;if(s.box>=4){s.box=4}else s.next=Date.now()+LEITNER[s.box]*864e5}
  S.log.push({q:q.id,th:q.theme,ok:ok?1:0,t:Date.now()});if(S.log.length>600)S.log=S.log.slice(-600);
  var d=today();S.days[d]=S.days[d]||{min:0,n:0};S.days[d].n++;
}
function addMinutes(ms){var d=today();S.days[d]=S.days[d]||{min:0,n:0};S.days[d].min+=ms/60000}

/* ---------- indicateur « prêt » ---------- */
function themeRates(){var by={};for(var i=S.log.length-1;i>=0;i--){var l=S.log[i];(by[l.th]=by[l.th]||[]);if(by[l.th].length<20)by[l.th].push(l.ok)}
  var out={};THEMES.forEach(function(t){var a=by[t.id]||[];out[t.id]=a.length>=5?a.reduce(function(s,x){return s+x},0)/a.length:null});return out}
function examList(){return S.attempts.filter(function(a){return a.type==="examen"})}
function coverage(){var seen=Object.keys(S.qs).length;return QS.length?seen/QS.length:0}
function activeDays(n){var c=0;for(var i=0;i<n;i++){var d=new Date();d.setDate(d.getDate()-i);var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.days[k]&&S.days[k].n>0)c++}return c}
function streak(){var c=0,i=0;var d0=today();if(!(S.days[d0]&&S.days[d0].n>0))i=1;var grace=1;for(;i<400;i++){var d=new Date();d.setDate(d.getDate()-i);var k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.days[k]&&S.days[k].n>0)c++;else if(grace>0&&c>0){grace--}else break}return c}
function readiness(){
  var ex=examList(),last=ex.slice(-CFG.steps).map(function(a){return a.score}),rates=themeRates(),vals=Object.keys(rates).map(function(k){return rates[k]}).filter(function(v){return v!=null});
  var weakest=vals.length?Math.min.apply(null,vals):null,cov=coverage(),r={level:"nodata",score:0,reasons:[],next:""};
  if(ex.length<3){r.next="Fais "+(3-ex.length)+" examen"+(3-ex.length>1?"s":"")+" blanc"+(3-ex.length>1?"s":"")+" pour voir où tu en es.";r.score=Math.round(Math.min(40,ex.length*10+cov*20));return r}
  var avg=last.reduce(function(s,x){return s+x},0)/last.length;
  var map=function(x){return x>=40?100:x>=35?80+(x-35)*4:x>=30?40+(x-30)*8:Math.max(0,(x/30)*40)};
  var span=ex.length>=CFG.steps?dayDiff(new Date(ex[ex.length-CFG.steps].t).toISOString().slice(0,10),today()):0;
  var allOk=last.length>=CFG.steps&&last.every(function(x){return x>=CFG.threshold});
  var regular=activeDays(7)>=4,okThemes=weakest!=null&&weakest>=CFG.weakMin,okCov=cov>=CFG.coverageMin,okSpan=span>=21;
  var okCount=last.filter(function(x){return x>=CFG.threshold}).length;
  r.score=Math.round(.5*map(avg)+.25*(weakest==null?50:weakest*100)+.15*(Math.min(activeDays(7),5)/5*100)+.10*Math.min(cov/CFG.coverageMin,1)*100);
  if(allOk&&okThemes&&okCov&&okSpan&&regular){r.level="pret"}
  else if(okCount>=3||avg>=34){r.level="presque"}else r.level="pas";
  if(r.level==="pret")r.next="Garde le rythme jusqu'à l'examen.";
  else if(!okThemes&&weakest!=null){var wk=THEMES.filter(function(t){return rates[t.id]===weakest})[0];r.next="Travaille « "+wk.nom+" » : "+Math.round(weakest*100)+" % de réussite récente."}
  else if(!okCov)r.next="Il reste des questions jamais vues : "+Math.round(cov*100)+" % de la banque parcourue.";
  else if(!allOk)r.next="Vise "+CFG.steps+" examens blancs de suite à "+CFG.threshold+" ou plus.";
  else r.next="Garde 4 jours d'entraînement par semaine pendant 3 semaines.";
  return r;
}
var LV={nodata:["Pas assez de données","warn"],pas:["Pas encore prêt","bad"],presque:["Presque prêt","warn"],pret:["Prêt","good"]};
function publicState(){
  var r=readiness(),ex=examList(),sh=S.share;
  if(!sh.on||sh.pause)return {pause:true,at:Date.now(),why:sh.pause?"pause":"off"};
  var o={pause:false,level:r.level,score:r.score,next:r.next,exams:ex.slice(-8).map(function(a){return a.score}),days7:activeDays(7),streak:streak(),nExams:ex.length,cov:Math.round(coverage()*100),at:Date.now(),prenom:S.prenom||""};
  if(sh.themes){var tr=themeRates();o.themes=THEMES.map(function(t){return {n:t.nom,v:tr[t.id]==null?null:Math.round(tr[t.id]*100)}})}
  return o;
}

var I={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',

function gauge(score,level){
  var col=level==="pret"?"var(--good)":level==="presque"?"var(--warn)":level==="nodata"?"var(--mut)":"var(--bad)";
  var a=Math.PI*(1-score/100),x=150+110*Math.cos(a),y=150-110*Math.sin(a);
  return '<svg class="gauge" viewBox="0 0 300 175" role="img" aria-label="Niveau de préparation : '+score+' sur 100"><path d="M40 150A110 110 0 0 1 260 150" fill="none" stroke="var(--line)" stroke-width="18" stroke-linecap="round"/>'+(score>0?'<path d="M40 150A110 110 0 0 1 '+x.toFixed(1)+' '+y.toFixed(1)+'" fill="none" stroke="'+col+'" stroke-width="18" stroke-linecap="round"/>':'')+'<text x="150" y="140" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="700" font-size="54" fill="var(--ink)">'+score+'</text><text x="150" y="165" text-anchor="middle" font-size="13" fill="var(--mut)">sur 100</text></svg>';
}
function viewRole(){return '<div class="stack"><div><h1>Qui es-tu ?</h1><p class="mut">Choisis une fois. Ton téléphone s\'en souvient et tu arrives directement sur ta vue.</p></div><button class="tile" data-role="eleve" style="min-height:112px"><b>Je suis l\'élève</b><span class="small mut">Examens blancs, mises en situation, mes erreurs</span></button><button class="tile" data-role="parent" style="min-height:112px"><b>Je suis un parent</b><span class="small mut">Voir où en est l\'élève, sans le détail de ses réponses</span></button></div>'}
function viewWelcome(){return '<div class="stack"><h1>Salut, on prépare le code ensemble</h1><p class="mut">Des examens blancs de 40 questions, des mises en situation à toucher, et la correction de chaque erreur. Seuil officiel : 35 bonnes réponses sur 40.</p><div class="card stack"><label for="pn"><b>Ton prénom</b></label><input id="pn" type="text" autocomplete="given-name" placeholder="Prénom"><button class="btn pri big" data-act="start">C\'est parti</button></div></div>'}

  return '<div class="stack"><div><h1>Salut '+esc(S.prenom)+'</h1><p class="mut small">'+(streak()>0?streak()+' jour'+(streak()>1?'s':'')+' d\'entraînement de suite':'Une séance courte aujourd\'hui, c\'est un bon début.')+'</p></div>'+

  '<button class="btn big" data-act="sendpapa">Envoyer mon point à un parent</button><p class="tiny mut" style="margin-top:-6px">Ouvre WhatsApp ou SMS avec un message prêt, rien ne part tout seul.</p><div id="sendbox"></div>'+

function spark(vals){
  if(!vals.length)return '<p class="small mut">Aucun examen blanc pour l\'instant.</p>';
  var w=300,h=96,n=vals.length,bw=Math.min(28,(w-20)/n-6),sx=function(i){return 10+i*((w-20)/n)+((w-20)/n-bw)/2},sy=function(v){return h-14-(v/40)*(h-28)};
  var out='<line x1="0" x2="'+w+'" y1="'+sy(35)+'" y2="'+sy(35)+'" stroke="var(--amber)" stroke-width="2" stroke-dasharray="6 5"/><text x="'+(w-2)+'" y="'+(sy(35)-4)+'" text-anchor="end" font-size="10" fill="var(--mut)">35</text>';
  vals.forEach(function(v,i){out+='<rect x="'+sx(i)+'" y="'+sy(v)+'" width="'+bw+'" height="'+(h-14-sy(v))+'" rx="3" fill="'+(v>=35?"var(--good)":"var(--sign)")+'"/><text x="'+(sx(i)+bw/2)+'" y="'+(h-2)+'" text-anchor="middle" font-size="10" fill="var(--mut)">'+v+'</text>'});
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Scores des derniers examens blancs">'+out+'</svg>';
}

function startSession(kind,qs,opt){

  sess={kind:kind,qs:qs,i:0,res:[],t0:Date.now(),qt0:Date.now(),theme:opt.theme||null,phase:opt.breath?"breath":"q",sel:[],checked:false,left:CFG.secPerQ,tm:null,scn:null,seedBase:Date.now()};

function toast(m){var n=$("#app");var d=document.createElement("div");d.className="note";d.textContent=m;n.prepend(d);setTimeout(function(){d.remove()},3000)}
function curQ(){var s=sess;if(!s.cq||s.cqi!==s.i){s.cqi=s.i;s.cq=QAdapt.materialize(s.qs[s.i],(s.seedBase+s.i*7919)>>>0);s.sc=null;try{s.sc=QAdapt.toScene(s.cq)}catch(e){s.sc=null}}return s.cq}

  var s=sess;

    if(multi&&!s.checked)h+='<p class="small mut" style="margin-top:8px">Plusieurs réponses possibles. Il faut toutes les bonnes et aucune fausse.</p>';

function feedback(q){

function bindSession(){

    try{
      var first=s.playedFor!==s.i;s.playedFor=s.i;
      s.scn=Scenes.render(host,s.sc.scene,{autoplay:first,showPrompt:s.sc.interactive,showExplain:false,locked:s.checked,onAnswer:function(a){if(s.checked)return;finishQ(!!a.correct,s.sc.interactive?a.answer:null)}});

function startTimer(){

function finishQ(ok,chosen){
  var s=sess,q=s.cq;if(s.checked)return;

  s.checked=true;s.res[s.i]={id:q.id,ok:ok,ms:ms,th:q.theme,chosen:chosen||s.sel.slice()};

function act(a){
  var s=sess;
  if(a==="quit"){if(s){clearInterval(s.tm);finalize(true)}sess=null;render();return}
  if(a==="gobreath"){s.phase="q";s.qt0=Date.now();s.left=CFG.secPerQ;render();return}
  if(a==="check"){var q=s.cq,ok=s.sel.length===q.bonnes.length&&q.bonnes.every(function(b){return s.sel.indexOf(b)>-1});finishQ(ok);return}
  if(a==="replay"){if(s.scn&&s.scn.replay)s.scn.replay();return}
  if(a==="next"){
    if(s.i+1>=s.qs.length){s.phase="end";finalize(false);render();return}
    s.i++;s.sel=[];s.checked=false;s.left=CFG.secPerQ;s.qt0=Date.now();render();return}
  if(a==="sendpapa"){sendPapa();return}
  if(a==="end"){sess=null;tab="accueil";render()}
  if(a==="rework"){var wrong=s.res.filter(function(r){return !r.ok}).map(function(r){return QS.filter(function(q){return q.id===r.id})[0]}).filter(Boolean);sess=null;startSession("erreurs",wrong)}
}
